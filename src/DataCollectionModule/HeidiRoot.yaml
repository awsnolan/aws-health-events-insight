---
AWSTemplateFormatVersion: "2010-09-09"
Description: Root stack for DataCollection ES-Heidi (SO9034)

Parameters:
  AWSOrganizationID:
    Type: String
    Description: The AWS Organizations ID for the organization that should be allowed to put events on the event bus. 'Comma Delimited list of AWS Organization IDs for all Payer Account'
  DataCollectionBucket:
    Type: String
    Description: Name of the S3 Bucket to be created to hold data information. 
  DataCollectionBucketKmsArn:
    Type: String
    Default: "na"
    Description: Enter KMS Arn if supplied Destination bucket is encrypted with KMS(Type N for SSE encryption)
  AthenaResultBucket:
    Type: String
    Default: "aws-athena-query-results-*"
    Description: S3 Bucket where Amazon Athena stores results
  AthenaBucketKmsArn:
    Type: String
    Default: "na"
    Description: Enter KMS Arn if Athena Results bucket is encrypted with KMS(Type N for SSE encryption)
  LakeFormationGoverned:
    Type: String
    Default: "no"
    AllowedValues: [ "yes", "no" ]
    Description: >-
      Set "yes" if this account's AWS Glue Data Catalog is governed by Lake
      Formation (LF-only mode). This creates LF grants on the Heidi database and
      tables so Athena/QuickSight/the S3 extract can read them. Leave "no" for
      IAM-only catalogs (default) to avoid creating unnecessary LF grants. NOTE:
      the deploying principal must still be a Lake Formation data-lake admin to
      create the database.
  QuickSightAnalysisAuthor:
      Type: String
      Default: "na"
      Description: The QuickSight analysis author Arn that is allowed configure and manage the QS Analyses and dashboards. e.g. arn:aws:quicksight:<Region>:<AccountID>:user/default/<username>. Only required when OutputMode is "quicksight" or "both".
  ResourcePrefix:
    Type: String
    Description: This prefix will be placed in front of resources created where required. Note you may wish to add a dash at the end to make more readable
    Default: "heidi-"
  EnableHealthModule:
    Type: String
    Description: Collects AWS Health data from different accounts and create quicksight analysis
    Default: "yes"
    AllowedValues:
      - "yes"
      - "no"
  EnableHealthEventUrl:
    Type: String
    Description: "Optional: Event URL are for easy read. Enabling this would create DynamoDB, APIGW and Lambda"
    Default: "no"
    AllowedValues:
      - "yes"
      - "no"
  Enabletaginfo:
    Type: String
    Description: "Optional: Enable Tag enrichment to pull tagging info from resource explorer API"
    Default: "no"
    AllowedValues:
      - "yes"
      - "no"
  ResourceExplorerViewArn:
    Type: String
    Default: "na"
    Description: If Enabletaginfo, Resource Explorer View Arn is required.
  EnableNotificationModule:
    Type: String
    Description: "Optional: This required preauth with chatbot and slack/teams as prereq."
    Default: "no"
    AllowedValues:
      - "yes"
      - "no"
  SlackChannelId:
    Type: String
    Default: "na"
    Description: If EnableNotificationModule, ensure that the SlackChannelId is provided when the channel is Slack.
  SlackWorkspaceId:
    Type: String
    Default: "na"
    Description: If EnableNotificationModule, ensure that the SlackWorkspaceId is provided when the channel is Slack.
  TeamId:
    Type: String
    Description: If EnableNotificationModule, ensure that the TeamId is provided when the channel is Slack.
    Default: "na"
  TeamsTenantId:
    Type: String
    Description: If EnableNotificationModule, ensure that the TeamsTenantId is provided when the channel is Slack.
    Default: "na"
  TeamsChannelId:
    Type: String
    Description: If EnableNotificationModule, ensure that the TeamsChannelId is provided when the channel is Slack.
    Default: "na"
  EnableCreditModule:
    Type: String
    Description: "Optional: Open Jira SLA service-credit tickets for service-interruption (issue) events."
    Default: "no"
    AllowedValues:
      - "yes"
      - "no"
  JiraBaseUrl:
    Type: String
    Default: "na"
    Description: If EnableCreditModule, Jira Cloud base URL, e.g. https://yourorg.atlassian.net
  JiraProjectKey:
    Type: String
    Default: "na"
    Description: If EnableCreditModule, Jira project key that receives credit-evaluation tickets.
  JiraSecretArn:
    Type: String
    Default: "na"
    Description: If EnableCreditModule, Secrets Manager ARN holding Jira email/apiToken.
  OutputMode:
    Type: String
    Default: "s3"
    AllowedValues: [ "quicksight", "s3", "both" ]
    Description: >-
      How collected AWS Health data is surfaced.
      "s3" (default): scheduled Athena extract to S3 (CSV/JSON) only — no QuickSight
      datasource, datasets, or analyses are created. This is the lean footprint.
      "quicksight": the QuickSight datasets and SLA/issue analyses only.
      "both": S3 extract plus QuickSight.
  ExtractFormat:
    Type: String
    Default: "CSV"
    AllowedValues: [ "CSV", "JSON" ]
    Description: When OutputMode includes S3, the extract output format.
  ExtractSchedule:
    Type: String
    Default: "rate(1 day)"
    Description: When OutputMode includes S3, the EventBridge schedule expression.
  ServiceUsageMode:
    Type: String
    Default: "off"
    AllowedValues: [ "off", "flag", "filter" ]
    Description: >-
      S3 extract service-usage awareness. "off" (default): no change. "flag":
      add a service_in_use column (Y/N/UNREVIEWED), maintain the services_in_use
      reference CSV, and report newly seen services each run; nothing dropped.
      "filter": also drop PUBLIC events whose service the operator marked
      in_use=N. Account-specific events are always kept.

Conditions:
  EnableHealthModule: !Equals [ !Ref EnableHealthModule, "yes"]
  EnableCreditModule: !Equals [ !Ref EnableCreditModule, "yes"]
  # QuickSight datasets/analyses deploy for "quicksight" or "both".
  DeployQuickSight: !And
    - !Condition EnableHealthModule
    - !Or [ !Equals [ !Ref OutputMode, "quicksight" ], !Equals [ !Ref OutputMode, "both" ] ]
  # The scheduled S3 extract deploys for "s3" or "both".
  DeployS3Extract: !And
    - !Condition EnableHealthModule
    - !Or [ !Equals [ !Ref OutputMode, "s3" ], !Equals [ !Ref OutputMode, "both" ] ]
  EnableHealthEventUrl: !Equals [ !Ref EnableHealthEventUrl, "yes"]
  EnableNotificationModule: !Equals [ !Ref EnableNotificationModule, "yes"]
  Enabletaginfo: !Equals [ !Ref Enabletaginfo, "yes"]
  DeployHealthEventUrl: !And 
    - !Condition EnableHealthModule
    - !Condition EnableHealthEventUrl
  DeploytaginfoSetup: !And
    - !Condition EnableHealthModule
    - !Condition Enabletaginfo

Resources:
  DataCollectionModule:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/DataCollectionModule/DataCollectionModule.yaml
      Parameters:
        AWSOrganizationID: !Ref AWSOrganizationID
        DataCollectionBucket: !Ref DataCollectionBucket
        DataCollectionBucketKmsArn: !Ref DataCollectionBucketKmsArn
        AthenaResultBucket: !Ref AthenaResultBucket
        AthenaBucketKmsArn: !Ref AthenaBucketKmsArn
        ResourcePrefix: !Ref ResourcePrefix
        EnableHealthModule: !Ref EnableHealthModule
        OutputMode: !Ref OutputMode
        LakeFormationGoverned: !Ref LakeFormationGoverned

####Notification Module Stack Start########
  NotificationModuleSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: DataCollectionModule
    Condition: EnableNotificationModule
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/NotificationModule/NotificationModule.yaml
      Parameters:
        DataCollectionAccountID: !Sub ${AWS::AccountId}
        ResourcePrefix: !Ref ResourcePrefix
        SlackChannelId: !Ref SlackChannelId
        SlackWorkspaceId: !Ref SlackWorkspaceId
        TeamId: !Ref TeamId
        TeamsTenantId: !Ref TeamsTenantId
        TeamsChannelId: !Ref TeamsChannelId

####Health Module Stack Start#####
  HealthModuleCollectionSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: DataCollectionModule
    Condition: EnableHealthModule
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleCollectionSetup.yaml
      Parameters:
        DataCollectionAccountID: !Sub ${AWS::AccountId}
        DataCollectionRegion: !Sub ${AWS::Region}
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleDataSetSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: HealthModuleCollectionSetup
    Condition: DeployQuickSight
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleDataSetSetup.yaml
      Parameters:
        QuickSightAnalysisAuthor: !Ref QuickSightAnalysisAuthor
        HeidiDataCollectionDB: !GetAtt DataCollectionModule.Outputs.HeidiDataCollectionDB
        HeidiQSDataSourceArn: !GetAtt DataCollectionModule.Outputs.HeidiQSDataSourceArn
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleEventUrlSetup:
    Type: AWS::CloudFormation::Stack
    Condition: DeployHealthEventUrl
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleEventUrlSetup.yaml
      Parameters:
        DataCollectionAccountID: !Sub ${AWS::AccountId}
        DataCollectionRegion: !Sub ${AWS::Region}
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleTaginfoSetuo:
    Type: AWS::CloudFormation::Stack
    Condition: DeploytaginfoSetup
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleTaginfoSetup.yaml
      Parameters:
        DataCollectionAccountID: !Sub ${AWS::AccountId}
        DataCollectionRegion: !Sub ${AWS::Region}
        ResourcePrefix: !Ref ResourcePrefix
        ResourceExplorerViewArn: !Ref ResourceExplorerViewArn

  HealthModuleQSAnalysis:
    Type: AWS::CloudFormation::Stack
    DependsOn: HealthModuleCollectionSetup
    Condition: DeployQuickSight
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleQSAnalysis.yaml
      Parameters:
        QuickSightAnalysisAuthor: !Ref QuickSightAnalysisAuthor
        QSDataSetHealthEvent: !GetAtt HealthModuleDataSetSetup.Outputs.QSDataSetHealthEvent
        EventDetailUrl: !If [ EnableHealthEventUrl, !GetAtt HealthModuleEventUrlSetup.Outputs.EventDetailApiEndpoint, "https://example.com" ]
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleServiceDataSetSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: HealthModuleDataSetSetup
    Condition: DeployQuickSight
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleServiceDataSetSetup.yaml
      Parameters:
        QuickSightAnalysisAuthor: !Ref QuickSightAnalysisAuthor
        HeidiDataCollectionDB: !GetAtt DataCollectionModule.Outputs.HeidiDataCollectionDB
        HeidiQSDataSourceArn: !GetAtt DataCollectionModule.Outputs.HeidiQSDataSourceArn
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleIssueDataSetSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: HealthModuleDataSetSetup
    Condition: DeployQuickSight
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleIssueDataSetSetup.yaml
      Parameters:
        QuickSightAnalysisAuthor: !Ref QuickSightAnalysisAuthor
        HeidiDataCollectionDB: !GetAtt DataCollectionModule.Outputs.HeidiDataCollectionDB
        HeidiQSDataSourceArn: !GetAtt DataCollectionModule.Outputs.HeidiQSDataSourceArn
        ResourcePrefix: !Ref ResourcePrefix

  HealthModuleCreditTicketSetup:
    Type: AWS::CloudFormation::Stack
    DependsOn: DataCollectionModule
    Condition: EnableCreditModule
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/CreditModule/CreditTicketModule.yaml
      Parameters:
        DataCollectionAccountID: !Sub ${AWS::AccountId}
        ResourcePrefix: !Ref ResourcePrefix
        JiraBaseUrl: !Ref JiraBaseUrl
        JiraProjectKey: !Ref JiraProjectKey
        JiraSecretArn: !Ref JiraSecretArn

  HealthModuleIssueQSAnalysis:
    Type: AWS::CloudFormation::Stack
    Condition: DeployQuickSight
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/HealthModule/HealthModuleIssueQSAnalysis.yaml
      Parameters:
        QSDataSetHealthIssueEvent: !GetAtt HealthModuleIssueDataSetSetup.Outputs.QSDataSetHealthIssueEvent
        QSDataSetHealthServiceEvent: !GetAtt HealthModuleServiceDataSetSetup.Outputs.QSDataSetHealthServiceEvent
        QuickSightAnalysisAuthor: !Ref QuickSightAnalysisAuthor
        ResourcePrefix: !Ref ResourcePrefix

  OutputS3ExtractSetup:
    Type: AWS::CloudFormation::Stack
    # Ordering on DataCollectionModule (which now owns the awshealthevent Glue
    # table) is enforced implicitly by the HeidiDataCollectionDB GetAtt below.
    Condition: DeployS3Extract
    Properties:
      TemplateURL: !Sub https://${DataCollectionBucket}.s3.amazonaws.com/DataCollection-metadata/OutputModule/S3ExtractModule.yaml
      Parameters:
        ResourcePrefix: !Ref ResourcePrefix
        HeidiDataCollectionDB: !GetAtt DataCollectionModule.Outputs.HeidiDataCollectionDB
        DataCollectionBucket: !Ref DataCollectionBucket
        ExtractFormat: !Ref ExtractFormat
        ExtractSchedule: !Ref ExtractSchedule
        ServiceUsageMode: !Ref ServiceUsageMode
